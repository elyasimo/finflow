services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: finflow-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: ${POSTGRES_DB:-finflow}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finflow']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finflow-network

  # API Server (Express/TypeScript)
  api:
    image: node:18-alpine
    container_name: finflow-api
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finflow}:${POSTGRES_PASSWORD:-secret}@postgres:5432/${POSTGRES_DB:-finflow}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-finflow}
      DB_USER: ${POSTGRES_USER:-finflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars-please-change-this}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:8081}
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET}
      BINANCE_API_BASE: ${BINANCE_API_BASE:-https://api.binance.com}
      BINANCE_API_TESTNET_BASE: ${BINANCE_API_TESTNET_BASE:-https://testnet.binance.vision}
      BINANCE_USE_TESTNET: ${BINANCE_USE_TESTNET:-false}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      ALPACA_API_KEY: ${ALPACA_API_KEY}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET}
      ALPACA_PAPER_TRADING: ${ALPACA_PAPER_TRADING:-true}
      ALPACA_BASE_URL: ${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
    ports:
      - '8081:8080'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
      - attachments_data:/app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finflow-network
    command: sh -c "apk add --no-cache postgresql-client bash && npm install && npx tsx watch src/server.ts"

  # Next.js Web Application
  web:
    image: node:18-alpine
    container_name: finflow-web
    working_dir: /app
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:8081
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - finflow-network
    command: sh -c "npm install && npm run dev"

  # pgAdmin (Optional - Database Management UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@finflow.app}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - finflow-network
    profiles:
      - tools

networks:
  finflow-network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
  attachments_data:
  backend_node_modules:
  web_node_modules:
